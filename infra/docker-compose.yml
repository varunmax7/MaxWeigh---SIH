# Tula — local development infrastructure.
#   docker compose -f infra/docker-compose.yml up -d
#
# On-prem first (implementation.md §3.2): every service here also runs on a
# lab LAN or an air-gapped VM. Nothing reaches the public internet at runtime.
#
# Host ports are overridable so the stack coexists with a Postgres or S3 already
# running on the machine: set POSTGRES_PORT / S3_PORT / SMTP_PORT in the root
# .env and point DATABASE_URL, S3_ENDPOINT and SMTP_URL at the same numbers.

name: tula

services:
  postgres:
    image: postgres:16-alpine
    container_name: tula-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tula
      POSTGRES_PASSWORD: tula
      POSTGRES_DB: tula
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tula -d tula']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # S3-compatible object storage.
  #
  # implementation.md §2 specifies MinIO. As of this build MinIO's container
  # images are no longer publicly pullable (Docker Hub and quay.io both answer
  # 401), so dev/on-prem storage runs SeaweedFS, which speaks the same S3 API.
  # Nothing in application code changes: it talks S3 through @aws-sdk/client-s3
  # against S3_ENDPOINT. See docs/QUESTIONS.md #4.
  storage:
    image: chrislusf/seaweedfs:latest
    container_name: tula-storage
    restart: unless-stopped
    command: >-
      server -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024
      -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - '${S3_PORT:-9000}:9000'
      - '${S3_MASTER_PORT:-9333}:9333'
      - '${S3_FILER_PORT:-8888}:8888'
    volumes:
      - storage-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:9333/cluster/healthz']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  storage-init:
    image: chrislusf/seaweedfs:latest
    container_name: tula-storage-init
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "echo 's3.bucket.create -name tula' | weed shell -master=storage:9333 && echo 'bucket tula ready'"

  mailpit:
    image: axllent/mailpit:latest
    container_name: tula-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '${SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
  storage-data:
